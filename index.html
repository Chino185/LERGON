<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LERGON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Geist+Mono:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    (function () {
      try {
        // The shared `theme` key belongs only to the landing page. When a
        // user-specific key exists, use it first so a previous landing dark
        // preference cannot flash across the authenticated app.
        var savedUserTheme = null;
        var authenticatedUserUid = null;
        try {
          // Supabase persists the current session in a key like
          // sb-<project-ref>-auth-token. Reading the user ID here lets the
          // first paint choose the exact account theme, even when both an
          // Administrator and Attendant have used this browser.
          var authKey = Object.keys(localStorage).find(function (key) {
            return key.indexOf('sb-') === 0 && key.indexOf('-auth-token') > 3;
          });
          if (authKey) {
            var authState = JSON.parse(localStorage.getItem(authKey) || 'null');
            authenticatedUserUid = authState && authState.user && authState.user.id
              ? authState.user.id
              : null;
          }
          // Only the user in the currently persisted Supabase session may
          // provide the authenticated first-paint theme. Never use the last
          // user UID after sign-out because that leaks one account's theme
          // into the landing page or the next account.
          if (authenticatedUserUid) {
            savedUserTheme = localStorage.getItem('lergon_theme_' + authenticatedUserUid);
          }
        } catch (_) { }
        var hasAuthenticatedSession = Boolean(authenticatedUserUid);
        // During an authenticated refresh, never fall back to the landing
        // page key. If the per-user value is not available yet, light is the
        // safe default and Supabase hydration will replace it if needed.
        var savedTheme = hasAuthenticatedSession
          ? (savedUserTheme || 'light')
          : localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else if (savedTheme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (_) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
